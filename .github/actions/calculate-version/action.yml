name: Calculate Version
description: KST 기반 시간 버전(YYYY.MMDD.N)을 계산합니다. Android 저장소와 같은 규칙입니다.

outputs:
  version:
    description: "Calculated version (YYYY.MMDD.N)"
    value: ${{ steps.version.outputs.version }}
  version-code:
    description: "TestFlight 빌드 번호 (YYMMDD*100+N). 재실행해도 값이 겹치지 않고 날짜 순서로 커진다"
    value: ${{ steps.version.outputs.version-code }}

runs:
  using: composite
  steps:
    - name: Determine next version
      id: version
      shell: bash
      run: |
        TODAY=$(TZ=Asia/Seoul date +"%Y.%m%d")
        EXISTING=$(gh release list --json tagName -q "[.[] | select(.tagName | startswith(\"v${TODAY}\"))] | length" 2>/dev/null || echo "0")
        SEQ=$((EXISTING + 1))
        NEXT_VERSION="${TODAY}.${SEQ}"
        if [ "$SEQ" -gt 99 ]; then
          echo "::error::하루 빌드가 99 번을 넘었습니다. 빌드 번호가 날짜 순서를 깨뜨립니다." >&2
          exit 1
        fi
        DATE_PART=$(TZ=Asia/Seoul date +"%y%m%d")
        NEXT_VERSION_CODE=$((10#$DATE_PART * 100 + SEQ))

        echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
        echo "version-code=$NEXT_VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "Version: $NEXT_VERSION (build $NEXT_VERSION_CODE)"
      env:
        GH_TOKEN: ${{ github.token }}
