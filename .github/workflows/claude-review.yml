name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# 같은 PR에 연속 push 시 낡은 diff 기준 리뷰가 중복 완주하지 않도록 이전 실행을 취소
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # 드래프트 PR은 리뷰하지 않음
    # 봇 작성 PR(develop→main 릴리즈 PR 등)은 리뷰 생략 — claude-code-action이 비인간 액터를 거부하고,
    # 내용도 develop 유입 시 이미 리뷰됨. 사람이 만든 feature 리뷰는 그대로 동작한다.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # 토큰이 없는 저장소·포크 PR 에서 리뷰 잡이 실패로 남으면 PR 상태가 빨갛게 보인다. 조용히 건너뛴다.
      - name: Check token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          # git diff로 베이스 브랜치와 비교하려면 전체 히스토리 필요 (얕은 클론이면 실패)
          fetch-depth: 0

      - name: Run Claude Code Review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress는 넣지 말 것: tag 모드(@claude 멘션 대기)로 강제되어 자동 리뷰가 실행되지 않음
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 코드 리뷰해줘. 리뷰는 한국어로.
            모여타 iOS 앱(SwiftUI 멀티모듈, Swift 6)이야. Android 앱(SWM-Moyeota/frontend)과 같은 동작을 유지하는 것이 목표고, 규칙은 docs/PORTING.md, 플랫폼 차이는 docs/IOS-DIFFERENCES.md 에 있어.
            모듈: Moyeota(앱 타깃·DI, Firebase 는 여기서만) / MoyeotaCore: MoyeotaDomain(모델·저장소 인터페이스)·MoyeotaData(URLSession·DTO·저장소 구현) / MoyeotaUI: MoyeotaDesignSystem·PresentationCore·AppNavigation·Feature*(기능 모듈끼리 import 금지). DI 는 수동 AppContainer.

            리뷰 관점:
            1. **버그** - 로직 오류, nil/엣지 케이스, Task 취소·예외 처리(살아 있는 태스크의 URLError(.cancelled) 는 실패로 다룬다), 상태 전이 누락
            2. **모듈 경계** - DTO 는 MoyeotaData 밖으로 노출 금지, 기능 모듈끼리 참조 금지, 도메인은 UI 의존 금지
            3. **SwiftUI** - 화면 뷰는 상태를 파라미터로 받는 순수 형태 유지(뷰모델 접근은 Route 에서만), 뷰모델 태스크가 self 를 강하게 잡지 않는지, onAppear 재호출로 인한 중복 요청, 하드코딩 색·치수 대신 디자인 시스템 토큰 사용
            4. **상태 처리** - 서버 연동 화면의 로딩/에러/재시도 상태 누락, 화면 재진입 시 갱신 타이밍
            5. **Android 와의 차이** - 문구·규칙·서버 계약이 원본과 어긋나는데 IOS-DIFFERENCES.md 에 없는 변경
            6. **보안** - 시크릿·토큰 하드코딩, 로그로 개인정보/토큰 노출

            리뷰 방법:
            - diff만 보지 말고 Read로 주변 코드 확인 후 판단
            - 문제 라인에 mcp__github_inline_comment__create_inline_comment로 인라인 코멘트, 심각도 표시(🔴/🟡/🟢), 수정 예시 포함
            - 마지막 전체 요약은 반드시 `gh pr comment`로 게시(최종 응답으로만 쓰면 아무도 못 봄)
            - 불확실하면 추측이라고 명시

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
