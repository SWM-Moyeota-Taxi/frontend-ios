name: Create Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    # 태그와 릴리스 노트가 먼저다. 업로드가 실패해도 무엇이 main 에 들어갔는지는 남는다.
    runs-on: ubuntu-latest
    outputs:
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        uses: ./.github/actions/calculate-version

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes --target "$GITHUB_SHA"

  testflight:
    needs: release
    uses: ./.github/workflows/testflight.yml
    with:
      build-number: ${{ needs.release.outputs.version-code }}
    secrets: inherit
